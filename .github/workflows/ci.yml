name: CI

on:
  push:
  pull_request:

jobs:
  text-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "services/text-engine[dev]"
      - run: python -m pytest
        working-directory: services/text-engine

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -c "import json; json.load(open('shared/schemas/document.schema.json', encoding='utf-8'))"

