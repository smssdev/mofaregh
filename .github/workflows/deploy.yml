name: deploy

# Ships main to the Hostinger VPS (https://mofaregh.smszs.tech) once CI passes on it, or by hand from the
# Actions tab. Needs the SSH_HOST, SSH_USER and SSH_KEY secrets and the APP_DIR variable (deploy/README.md);
# skipped until they exist.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mofaregh.smszs.tech
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      APP_DIR: ${{ vars.APP_DIR || '/home/mofaregh/htdocs/mofaregh.smszs.tech' }}

    steps:
      - name: Check that the server is set up
        id: ready
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "::warning::Deploy skipped: add the SSH_HOST, SSH_USER and SSH_KEY secrets (see deploy/README.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup PHP
        if: steps.ready.outputs.ok == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Setup Node
        if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build
        if: steps.ready.outputs.ok == 'true'
        run: |
          composer install --working-dir=apps/api --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          npm ci --prefix apps/web
          npm run build --prefix apps/web   # writes the SPA into apps/api/public/spa

      - name: Upload and activate the release
        if: steps.ready.outputs.ok == 'true'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          release="$APP_DIR/releases/$(date -u +%Y%m%d%H%M%S)-${RELEASE_SHA::7}"
          ssh="ssh -p $SSH_PORT -o BatchMode=yes"

          $ssh "$SSH_USER@$SSH_HOST" "mkdir -p '$release'"
          rsync -az --delete -e "$ssh" \
            --exclude='node_modules/' --exclude='tests/' --exclude='storage/' --exclude='.env' \
            --exclude='database/*.sqlite' \
            apps/api/ "$SSH_USER@$SSH_HOST:$release/"
          # The Python packages the API runs (Word export, ASR); activate.sh installs them into shared/venv.
          $ssh "$SSH_USER@$SSH_HOST" "mkdir -p '$release/python'"
          rsync -az --delete -e "$ssh"             --exclude='tests/' --exclude='samples/' --exclude='scripts/' --exclude='__pycache__/' --exclude='*.egg-info/'             services/text-engine services/asr "$SSH_USER@$SSH_HOST:$release/python/"
          $ssh "$SSH_USER@$SSH_HOST" "cd '$release' && APP_DIR='$APP_DIR' bash -s" < deploy/activate.sh

      - name: Check the site answers
        if: steps.ready.outputs.ok == 'true'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null https://mofaregh.smszs.tech/up
          curl --fail --silent --show-error -o /dev/null https://mofaregh.smszs.tech/login
