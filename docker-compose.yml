services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mofaregh}
      POSTGRES_USER: ${DB_USERNAME:-mofaregh}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  text-engine:
    build: ./services/text-engine
    environment:
      QURAN_CORPUS_PATH: /data/quran
    volumes:
      - ./services/text-engine/data:/data:ro
    ports: ["8001:8001"]

volumes:
  pgdata:
  miniodata:
