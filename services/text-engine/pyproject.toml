[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mofaregh-text"
version = "0.1.0"
description = "Arabic text engine for Mofaregh: normalization, Quran/hadith lookup, locked-block validation and Word export."
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0",
  "pydantic>=2.6",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mofaregh_text = ["export/templates/*.docx"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
